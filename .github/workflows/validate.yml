name: Core and frontend validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: tools/setup.sh
      - run: npm run validate
      - name: Record legacy mixed-stage screenshot diagnostic
        continue-on-error: true
        run: set -o pipefail; .venv/bin/python tools/cmp_ref.py testroms 120 | tee out/legacy-reference-diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            out/homebrew.json
            out/legacy-reference-diagnostic.log
            out/photon64.html
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mobile: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: tools/setup.sh
      - run: npx playwright install --with-deps chromium
      - name: Build the self-contained app
        run: . out/env.sh && npm run build
      - name: Check browser persistence and lifecycle with a shipped fixture
        run: node tools/browsercheck.mjs testroms/RSPCP2VRCP.N64
        env:
          BROWSER_MOBILE: ${{ matrix.mobile }}
      - name: Benchmark repeatable software execution
        if: matrix.mobile == '0'
        run: node tools/benchmark.mjs testroms/RSPCP2VRCP.N64 --frames 240 --warmup 120 --repeats 2 --output out/benchmark-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-mobile-${{ matrix.mobile }}
          path: |
            out/browser-evidence/
            out/benchmark-fixture/
