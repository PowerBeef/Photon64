name: Publish validated release
on:
  push:
    branches: [main]
    paths: ['.github/release.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photon64-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the exact source revision passed the full matrix
        id: release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('.github/release.json', 'utf8'));
            const {tag, target_sha: sha, validation_run_id: run_id, prerelease} = config;
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag) ||
                !/^[0-9a-f]{40}$/.test(sha) || !Number.isSafeInteger(run_id) || run_id <= 0 ||
                typeof prerelease !== 'boolean' || !fs.existsSync(`releases/${tag}.md`))
              throw new Error('Invalid release manifest or missing notes');
            const repo = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id});
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.event !== 'push' || run.head_branch !== 'main' || run.head_sha !== sha ||
                run.path !== '.github/workflows/validate.yml' ||
                run.head_repository?.full_name !== `${repo.owner}/${repo.repo}`)
              throw new Error('Release source does not have a successful main validation run');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {...repo, run_id, filter: 'latest', per_page: 100});
            require('./tools/release-gate.cjs').verifyJobs(jobs);
            // Existing releases are immutable. Re-running a completed publish is harmless.
            try {
              const {data: ref} = await github.rest.git.getRef({...repo, ref: `tags/${tag}`});
              if (ref.object.type !== 'commit' || ref.object.sha !== sha)
                throw new Error('Existing tag differs from the validated source');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let exists = false;
            try {
              const {data: release} = await github.rest.repos.getReleaseByTag({...repo, tag});
              const {data: ref} = await github.rest.git.getRef({...repo, ref: `tags/${tag}`});
              if (release.draft || ref.object.type !== 'commit' || ref.object.sha !== sha)
                throw new Error('Existing draft or tag differs; inspect before retrying');
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            for (const [key, value] of Object.entries({tag, sha, run_id, prerelease, exists}))
              core.setOutput(key, String(value));
      - name: Download the artifact tested by that exact validation run
        if: steps.release.outputs.exists != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-evidence
          path: tested
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Package the self-contained app and provenance
        if: steps.release.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
          VALIDATION_RUN: ${{ steps.release.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir release-assets
          test -s tested/photon64.html
          cp tested/photon64.html release-assets/photon64.html
          git fetch --no-tags origin "$SOURCE_SHA"
          git show "$SOURCE_SHA:LICENSE" > release-assets/LICENSE.txt
          git show "$SOURCE_SHA:THIRD_PARTY.md" > release-assets/THIRD_PARTY.md
          test -s tested/build-info.json
          cp tested/build-info.json release-assets/tested-build-info.json
          git show "$SOURCE_SHA:third_party/softfloat/COPYING.txt" > release-assets/SoftFloat-LICENSE.txt
          git show "$SOURCE_SHA:third_party/ares/LICENSE.txt" > release-assets/ares-LICENSE.txt
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re
          directory = pathlib.Path('release-assets')
          tested = json.loads((directory / 'tested-build-info.json').read_text())
          if tested['source_sha'] != os.environ['SOURCE_SHA']:
              raise SystemExit('Tested build source differs')
          if tested.get('dirty') is not False:
              raise SystemExit('Tested build has uncommitted source changes')
          if tested['html_sha256'] != hashlib.sha256((directory / 'photon64.html').read_bytes()).hexdigest():
              raise SystemExit('Tested HTML digest differs')
          wasm_digest = hashlib.sha256(pathlib.Path('tested/n64.wasm').read_bytes()).hexdigest()
          embedded = re.search(r'const WASM_B64 = "([A-Za-z0-9+/=]+)";', (directory / 'photon64.html').read_text())
          if not embedded or tested['wasm_sha256'] != wasm_digest or hashlib.sha256(base64.b64decode(embedded.group(1), validate=True)).hexdigest() != wasm_digest:
              raise SystemExit('Tested and embedded WASM digests differ')
          files = sorted(directory.iterdir())
          metadata = {
              'tag': os.environ['RELEASE_TAG'],
              'source_sha': os.environ['SOURCE_SHA'],
              'validation_run': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['VALIDATION_RUN']}",
              'files': {p.name: {'sha256': hashlib.sha256(p.read_bytes()).hexdigest(), 'bytes': p.stat().st_size} for p in files},
          }
          (directory / 'build-info.json').write_text(json.dumps(metadata, indent=2) + '\n')
          files = sorted(directory.iterdir())
          (directory / 'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Create the draft with assets, then publish
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.sha }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* --target "$SOURCE_SHA" \
            --title "Photon64 $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md" \
            --draft "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json url,tagName,isDraft,isPrerelease,assets
