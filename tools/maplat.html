<!doctype html><meta charset="utf-8">
<script>
// How long does a GPU -> CPU round trip take in this browser when the GPU has (almost) nothing else to do?
window.runTest = async function () {
  const adapter = await navigator.gpu.requestAdapter(); const device = await adapter.requestDevice();
  const src = device.createBuffer({ size: 1 << 20, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
  const out = [];
  for (const mode of ['idle', 'raf']) {
    const lat = [];
    for (let i = 0; i < 40; i++) {
      if (mode === 'raf') await new Promise(r => requestAnimationFrame(r));     // start from inside an animation frame, like the emulator does
      const dst = device.createBuffer({ size: 1 << 20, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
      device.queue.writeBuffer(src, 0, new Uint32Array([i]));
      const enc = device.createCommandEncoder(); enc.copyBufferToBuffer(src, 0, dst, 0, 1 << 20); device.queue.submit([enc.finish()]);
      const t = performance.now();
      await dst.mapAsync(GPUMapMode.READ);
      lat.push(performance.now() - t);
      dst.unmap(); dst.destroy();
    }
    lat.sort((a, b) => a - b);
    out.push(`${mode}: median ${lat[20].toFixed(2)} ms, p90 ${lat[36].toFixed(2)} ms, max ${lat[39].toFixed(2)} ms`);
  }
  return out;
};
</script>
